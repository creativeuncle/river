services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: river
      POSTGRES_PASSWORD: river_dev_pw
      POSTGRES_DB: river
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U river"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    image: node:22
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://river:river_dev_pw@postgres:5432/river
      JWT_SECRET: dev-only-change-me-in-production
      PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:4000
    depends_on:
      - server

volumes:
  pgdata:
  server_node_modules:
  web_node_modules:
